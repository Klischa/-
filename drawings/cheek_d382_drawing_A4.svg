<text x="180.0" y="96.0" class="txt-b" font-size="2.8px">Технические требования:</text>
<text x="180.0" y="100.5" class="txt" font-size="2.2px">1. *Размеры для справок.</text>
<text x="180.0" y="104.5" class="txt" font-size="2.2px">2. Наружный обод Ø 381,9 мм служит опорой для гусеницы «Муравей».</text>
<text x="180.0" y="108.5" class="txt" font-size="2.2px">3. На одно опорно-ведущее колесо изготавливается 2 шт. щек.</text>
<text x="180.0" y="112.5" class="txt" font-size="2.2px">4. Заходные фаски 3×30° по наружному контуру обязательны</text>
<text x="180.0" y="116.5" class="txt" font-size="2.2px">   для предотвращения задира клыков гусеницы при поворотах.</text>
<text x="180.0" y="120.5" class="txt" font-size="2.2px">5. Допускается склеивание из двух слоев листового материала</text>
<text x="180.0" y="124.5" class="txt" font-size="2.2px">   толщиной по 9,5...10 мм (фанера ФСФ, капролон ПА-6).</text>
